<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101217"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="每日打卡"><title>我的每日打卡</title><style>*{box-sizing:border-box}body{margin:0;background:#101217;color:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}main{max-width:560px;margin:auto;padding:28px 18px 65px}h1{font-size:27px;margin:12px 0 5px}.sub{color:#9ca3af;font-size:13px}.summary{display:flex;align-items:end;justify-content:space-between;margin:32px 0 12px}.big{font-size:42px;font-weight:750}.track{height:10px;background:#30343c;border-radius:30px;overflow:hidden;margin-bottom:26px}.fill{height:100%;width:0;background:#2ac28f;transition:width .2s}.item{display:flex;align-items:center;gap:17px;background:#1b1e24;border:1px solid #343841;border-radius:17px;padding:20px 16px;margin-bottom:12px;cursor:pointer;min-height:90px}.item input{width:25px;height:25px;accent-color:#2ac28f;flex-shrink:0}.name{font-size:17px;font-weight:650;line-height:1.55}.time{font-size:14px;color:#a4abb6;margin-top:5px}.done .name{text-decoration:line-through;color:#8e96a2}button{border:1px solid #434954;background:#242832;color:white;padding:12px 16px;border-radius:12px;font-size:14px}button.primary{background:#2ac28f;color:#09140f;border:0;font-weight:700}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.history{margin-top:30px;border-top:1px solid #343841;padding-top:18px;color:#aab2bc;font-size:14px}.histrow{padding:8px 0;border-bottom:1px solid #252930;display:flex;justify-content:space-between}.note{font-size:12px;color:#8e96a2;line-height:1.7;margin-top:22px}</style></head><body><main><div class="sub" id="date"></div><h1>我的每日打卡</h1><div class="sub">固定日程 · 7项任务 · 自动保存</div><div class="summary"><div><div class="sub">今日完成率</div><div class="big" id="pct">0%</div></div><div class="sub" id="count">0 / 7 项</div></div><div class="track"><div class="fill" id="fill"></div></div><section id="list"></section><div class="buttons"><button class="primary" id="export">备份打卡记录</button><button id="reset">清除今日打卡</button></div><section class="history"><strong>最近7天记录</strong><div id="hist"></div></section><p class="note">记录保存在此浏览器本地。请定期使用“备份打卡记录”导出；更换设备或清除浏览器数据可能丢失记录。此文件不联网，不会自动同步。</p></main><script>const tasks=[['07:10–07:50','起床 洗漱 护肤 枸杞原浆 咖啡'],['08:00–11:40','晨间学习 有氧运动'],['12:00–13:30','电动车充电 午餐 补剂'],['14:00–17:40','午间学习 力量训练'],['18:00–20:00','晚餐 洗澡'],['20:00–23:30','自由时间'],['23:30–23:50','洗漱 护肤 睡前训练']];const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const today=key(new Date());const storage='daily_checklist_v6_'+today;const read=()=>{try{let x=JSON.parse(localStorage.getItem(storage));return Array.isArray(x)&&x.length===7?x:Array(7).fill(false)}catch{return Array(7).fill(false)}};let checked=read();document.getElementById('date').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});function render(){let n=checked.filter(Boolean).length;document.getElementById('pct').textContent=Math.round(n/7*100)+'%';document.getElementById('count').textContent=n+' / 7 项';document.getElementById('fill').style.width=n/7*100+'%';const el=document.getElementById('list');el.replaceChildren();tasks.forEach(([time,name],i)=>{let label=document.createElement('label');label.className='item'+(checked[i]?' done':'');let box=document.createElement('input');box.type='checkbox';box.checked=checked[i];box.addEventListener('change',()=>{checked[i]=box.checked;localStorage.setItem(storage,JSON.stringify(checked));render()});let wrap=document.createElement('div');let title=document.createElement('div');title.className='name';title.textContent=name;let t=document.createElement('div');t.className='time';t.textContent=time;wrap.append(title,t);label.append(box,wrap);el.append(label)});historyRender()}function historyRender(){let el=document.getElementById('hist');el.replaceChildren();for(let i=0;i<7;i++){let d=new Date();d.setDate(d.getDate()-i);let k=key(d);let data;try{data=JSON.parse(localStorage.getItem('daily_checklist_v6_'+k))}catch{}let n=Array.isArray(data)?data.filter(Boolean).length:0;let row=document.createElement('div');row.className='histrow';let a=document.createElement('span');a.textContent=k;let b=document.createElement('span');b.textContent=Array.isArray(data)?n+'/7':'暂无记录';row.append(a,b);el.append(row)}}document.getElementById('reset').onclick=()=>{if(confirm('确定清除今天所有勾选吗？')){checked=Array(7).fill(false);localStorage.setItem(storage,JSON.stringify(checked));render()}};document.getElementById('export').onclick=()=>{let lines=['每日打卡记录',...Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-i);let k=key(d);let arr;try{arr=JSON.parse(localStorage.getItem('daily_checklist_v6_'+k))}catch{}return k+'：'+(Array.isArray(arr)?arr.filter(Boolean).length+'/7':'无记录')}),'',today,...tasks.map(([time,name],i)=>(checked[i]?'☑':'☐')+' '+time+' '+name)].join('\n');let blob=new Blob([lines],{type:'text/plain;charset=utf-8'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='每日打卡备份_'+today+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();setInterval(()=>{if(key(new Date())!==today)location.reload()},60000);</script></body></html>
